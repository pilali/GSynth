<!--
  GSynth — MOD GUI icon template.
  Modelled on the MOD reference layout (cf. AidaDSP rt-neural-generic):
  - the root is laid out in normal flow (flexbox), NOT absolutely positioned;
    mod-ui wraps this template in its own .mod-pedal div and sizes it to the
    content, then positions the audio jacks itself via the global pedal CSS.
  - controls live inside a .mod-control-group so mod-ui layers them correctly.
  - the audio input/output blocks are left exactly as the default template:
    we do not restyle or reposition them, so the native jack 6.35 connectors
    are placed by mod-ui (only nudged to vertical centre in the stylesheet).
-->
<div class="gsynth{{{cns}}}">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <div class="gs-grid">

        <!-- Header -->
        <div class="gs-header">
            <span class="gs-brand">GSynth</span>
            <span class="gs-subtitle">GUITAR SYNTHESIZER</span>
            <div class="gs-led" mod-role="bypass-light"></div>
        </div>

        <!-- All sliders in one row, three groups -->
        <div class="mod-control-group gs-controls">

            <!-- VOICE MIX group -->
            <div class="gs-group">
                <div class="gs-sliders">
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="guitar"></div>
                        </div>
                        <span class="gs-label">GTR</span>
                    </div>
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="octave"></div>
                        </div>
                        <span class="gs-label">OCT</span>
                    </div>
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="sub_octave"></div>
                        </div>
                        <span class="gs-label">SUB</span>
                    </div>
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="square"></div>
                        </div>
                        <span class="gs-label">SQR</span>
                    </div>
                </div>
                <div class="gs-group-label">VOICE MIX</div>
            </div>

            <div class="gs-separator"></div>

            <!-- FILTER group -->
            <div class="gs-group">
                <div class="gs-sliders">
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="trigger"></div>
                        </div>
                        <span class="gs-label">TRIG</span>
                    </div>
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="attack_delay"></div>
                        </div>
                        <span class="gs-label">ATCK</span>
                    </div>
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="start_freq"></div>
                        </div>
                        <span class="gs-label">STRT</span>
                    </div>
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="stop_freq"></div>
                        </div>
                        <span class="gs-label">STOP</span>
                    </div>
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="resonance"></div>
                        </div>
                        <span class="gs-label">RES</span>
                    </div>
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="filter_rate"></div>
                        </div>
                        <span class="gs-label">RATE</span>
                    </div>
                </div>
                <div class="gs-group-label">FILTER</div>
            </div>

            <div class="gs-separator"></div>

            <!-- MISC group -->
            <div class="gs-group">
                <div class="gs-sliders">
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="input_drive"></div>
                        </div>
                        <span class="gs-label">DRV</span>
                    </div>
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="filter_type"></div>
                        </div>
                        <span class="gs-label">FILT</span>
                    </div>
                    <div class="gs-slider">
                        <div class="mod-slider">
                            <div class="mod-slider-image" mod-role="input-control-port" mod-port-symbol="pitch_track"></div>
                        </div>
                        <span class="gs-label">PTCH</span>
                    </div>
                </div>
                <div class="gs-group-label">MISC</div>
            </div>

        </div>

        <!-- Footer / footswitch -->
        <div class="gs-footer">
            <div class="gs-footswitch" mod-role="bypass">
                <div class="gs-footswitch-cap"></div>
            </div>
        </div>

    </div>

    <!-- Audio ports: default template markup, left untouched so mod-ui draws
         and positions its native jack 6.35 connectors. -->
    <div class="mod-pedal-input">
        {{#effect.ports.audio.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}"
             mod-role="input-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div>
        </div>
        {{/effect.ports.audio.input}}
    </div>
    <div class="mod-pedal-output">
        {{#effect.ports.audio.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}"
             mod-role="output-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div>
        </div>
        {{/effect.ports.audio.output}}
    </div>
</div>
